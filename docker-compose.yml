x-common-env: &common-env
  APP_ENV: ${APP_ENV:-local}
  DATABASE_URL: postgresql+psycopg2://bootcamp:bootcamp@db:5432/bootcamp
  INTERNAL_TOKEN: ${INTERNAL_TOKEN:-default_token}

x-service-healthcheck: &service-healthcheck
  test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:3000/health_check\")'"]
  interval: 3s
  timeout: 5s
  retries: 20
  start_period: 5s

x-service-base: &service-base
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    build: ./database
    environment:
      POSTGRES_USER: bootcamp
      POSTGRES_PASSWORD: bootcamp
      POSTGRES_DB: bootcamp
    ports:
      - "${DB_PORT:-5544}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bootcamp -d bootcamp"]
      interval: 3s
      timeout: 3s
      retries: 20

  mockserver:
    image: mockserver/mockserver:5.15.0
    ports:
      - "${MOCKSERVER_PORT:-1080}:1080"

  customer-service:
    <<: *service-base
    build:
      context: ./services/customer-service
      target: api
    ports:
      - "${CUSTOMER_PORT:-8001}:3000"
    environment:
      <<: *common-env
      SERVICE_NAME: customer-service
      BUREAU_URL: http://mockserver:1080
    depends_on:
      db:
        condition: service_healthy
      mockserver:
        condition: service_started
    healthcheck: *service-healthcheck

  account-service:
    <<: *service-base
    build:
      context: ./services/account-service
      target: api
    ports:
      - "${ACCOUNT_PORT:-8002}:3000"
    environment:
      <<: *common-env
      SERVICE_NAME: account-service
    healthcheck: *service-healthcheck

  transaction-service:
    <<: *service-base
    build:
      context: ./services/transaction-service
      target: api
    ports:
      - "${TRANSACTION_PORT:-8003}:3000"
    environment:
      <<: *common-env
      SERVICE_NAME: transaction-service
    healthcheck: *service-healthcheck

  statement-service:
    <<: *service-base
    build:
      context: ./services/statement-service
      target: api
    ports:
      - "${STATEMENT_PORT:-8004}:3000"
    environment:
      <<: *common-env
      SERVICE_NAME: statement-service
    healthcheck: *service-healthcheck
