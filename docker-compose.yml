# Sobe tudo com um comando: docker compose up -d
# Mudou um database.sql? docker compose down -v (o banco só roda o .sql ao nascer).
# Mudou um requirements.txt? docker compose build --no-cache.

x-common-env: &common-env
  APP_ENV: ${APP_ENV:-local}
  INTERNAL_TOKEN: ${INTERNAL_TOKEN:-default_token}
  SERVICE_TIMEOUT: ${SERVICE_TIMEOUT:-5}

x-service-healthcheck: &service-healthcheck
  test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:3000/health_check\")'"]
  interval: 3s
  timeout: 5s
  retries: 20
  start_period: 5s

x-db-base: &db-base
  image: postgres:16
  environment:
    POSTGRES_USER: bootcamp
    POSTGRES_PASSWORD: bootcamp
    POSTGRES_DB: bootcamp
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U bootcamp -d bootcamp"]
    interval: 3s
    timeout: 3s
    retries: 20

services:
  customer-db:
    <<: *db-base
    volumes:
      - ./services/customer-service/database/database.sql:/docker-entrypoint-initdb.d/01.sql:ro
      - customer-data:/var/lib/postgresql/data
    ports:
      - "${CUSTOMER_DB_PORT:-5545}:5432"

  account-db:
    <<: *db-base
    volumes:
      - ./services/account-service/database/database.sql:/docker-entrypoint-initdb.d/01.sql:ro
      - account-data:/var/lib/postgresql/data
    ports:
      - "${ACCOUNT_DB_PORT:-5546}:5432"

  transaction-db:
    <<: *db-base
    volumes:
      - ./services/transaction-service/database/database.sql:/docker-entrypoint-initdb.d/01.sql:ro
      - transaction-data:/var/lib/postgresql/data
    ports:
      - "${TRANSACTION_DB_PORT:-5547}:5432"

  # Simula os serviços de fora: o birô (/bureau) e a análise de documentos (/document-analysis).
  mock:
    image: mockserver/mockserver:5.15.0
    ports:
      - "${MOCKSERVER_PORT:-1080}:1080"

  customer-service:
    build:
      context: ./services/customer-service
      target: api
    ports:
      - "${CUSTOMER_PORT:-8001}:3000"
    environment:
      <<: *common-env
      SERVICE_NAME: customer-service
      DATABASE_URL: postgresql+psycopg2://bootcamp:bootcamp@customer-db:5432/bootcamp
      BUREAU_URL: http://mock:1080
      DOCUMENT_ANALYSIS_URL: http://mock:1080
    depends_on:
      customer-db:
        condition: service_healthy
      mock:
        condition: service_started
    healthcheck: *service-healthcheck

  account-service:
    build:
      context: ./services/account-service
      target: api
    ports:
      - "${ACCOUNT_PORT:-8002}:3000"
    environment:
      <<: *common-env
      SERVICE_NAME: account-service
      DATABASE_URL: postgresql+psycopg2://bootcamp:bootcamp@account-db:5432/bootcamp
      CUSTOMER_SERVICE_URL: http://customer-service:3000
      TRANSACTION_SERVICE_URL: http://transaction-service:3000
    depends_on:
      account-db:
        condition: service_healthy
    healthcheck: *service-healthcheck

  transaction-service:
    build:
      context: ./services/transaction-service
      target: api
    ports:
      - "${TRANSACTION_PORT:-8003}:3000"
    environment:
      <<: *common-env
      SERVICE_NAME: transaction-service
      DATABASE_URL: postgresql+psycopg2://bootcamp:bootcamp@transaction-db:5432/bootcamp
      ACCOUNT_SERVICE_URL: http://account-service:3000
    depends_on:
      transaction-db:
        condition: service_healthy
    healthcheck: *service-healthcheck

  # Sem banco: monta o extrato perguntando ao account-service e ao transaction-service.
  statement-service:
    build:
      context: ./services/statement-service
      target: api
    ports:
      - "${STATEMENT_PORT:-8004}:3000"
    environment:
      <<: *common-env
      SERVICE_NAME: statement-service
      ACCOUNT_SERVICE_URL: http://account-service:3000
      TRANSACTION_SERVICE_URL: http://transaction-service:3000
    healthcheck: *service-healthcheck

volumes:
  customer-data:
  account-data:
  transaction-data:
